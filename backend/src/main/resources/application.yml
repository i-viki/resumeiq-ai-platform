spring:
  application:
    name: resumeiq-platform

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:resumeiq
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

app:
  jwt:
    secret: dev-secret-key-minimum-32-characters-long-for-hmac
    expiration-ms: 90000
    refresh-expiration-ms: 604800000
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-flash-latest
  cors:
    allowed-origins: http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-flash-latest

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
